# ==============================================================================
# Render Blueprint Specification (1-Click Free Tier Backend Deployment)
# ==============================================================================
services:
  - type: web
    name: linkflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: REDIS_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false  # Paste your Neon DATABASE_URL here in Render Dashboard
      - key: DATABASE_URL_UNPOOLED
        sync: false  # Paste your Neon DATABASE_URL_UNPOOLED here in Render Dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random 64-char key!
      - key: FRONTEND_URL
        value: "https://your-frontend.vercel.app"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://*.vercel.app","http://localhost:3000"]'

